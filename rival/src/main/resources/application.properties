spring.application.name=rival

# H2 in-memory database (wiped on every restart, then re-seeded by DataSeeder)
spring.datasource.url=jdbc:h2:mem:rivaldb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
# Lets Thymeleaf templates read related data (e.g. a workout's sets) while rendering
spring.jpa.open-in-view=true

# H2 web console at /h2-console (allow-others is needed inside Docker)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
